<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEPOT SHOP</title><link rel="icon" href="/icon.jpg"><style>
:root{--yellow:#ffd12e;--red:#e4472e;--ink:#191919}*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:var(--ink);font-family:Arial,sans-serif}
header{background:linear-gradient(110deg,var(--yellow),#ffb52b);padding:24px 18px;border-bottom:5px solid var(--red)}
.wrap{max-width:1100px;margin:auto}h1{margin:0;font-size:30px}header p{margin:8px 0 0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:28px 16px}
.card{background:white;border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #0000000c}.card img{width:100%;height:190px;object-fit:cover;background:#f4eee0}.body{padding:16px}.body h2{font-size:19px;margin:0 0 8px}.muted{color:#666;font-size:14px;line-height:1.4}.price{font-weight:700;margin:14px 0}.buy{display:block;width:100%;border:0;border-radius:10px;background:var(--red);color:white;padding:12px;font-weight:700;font-size:15px;cursor:pointer}.buy:hover{filter:brightness(.94)}.empty{text-align:center;padding:55px 15px;color:#555}.empty strong{display:block;color:#222;font-size:21px;margin-bottom:8px}footer{text-align:center;padding:24px;color:#777;border-top:1px solid #eee}
</style></head><body><header><div class="wrap"><h1>LEPOT SHOP 🪐</h1><p>Выбирай продукт и переходи к оформлению в Telegram</p></div></header>
<main class="wrap"><section id="products" class="products"></section><div id="empty" class="empty" hidden><strong>Больше продуктов нет..</strong>Скоро они будут добавлены</div></main><footer>LEPOT SHOP 🪐</footer>
<script>
async function loadProducts(){const box=document.getElementById('products'),empty=document.getElementById('empty');try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();box.innerHTML='';if(!data.products.length){empty.hidden=false;return}empty.hidden=true;for(const p of data.products){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=p.cover;img.alt='Обложка товара';const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=p.name;const d=document.createElement('p');d.className='muted';d.textContent=p.description+' · Видео: '+p.video_count;const price=document.createElement('div');price.className='price';price.textContent=p.price+(p.currency==='XTR'?' ⭐':' 🎁');const btn=document.createElement('button');btn.className='buy';btn.textContent='Купить';btn.onclick=async()=>{btn.disabled=true;btn.textContent='Подождите...';try{const x=await fetch('/api/order-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:p.id})});const result=await x.json();if(!x.ok)throw Error(result.error||'Ошибка');location.href=result.url}catch(e){alert('Не удалось создать заказ: '+e.message);btn.disabled=false;btn.textContent='Купить'}};body.append(h,d,price,btn);card.append(img,body);box.append(card)}}catch(e){empty.hidden=false;empty.innerHTML='<strong>Магазин временно недоступен</strong>Попробуйте обновить страницу.'}}loadProducts();
</script></body></html>
